name: sita-auth-observatory

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: application
        image: sita-auth-observatory-app:${APP_IMAGE_TAG:-local}
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - observatory_storage:/var/www/html/storage
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'php artisan about --only=environment >/dev/null 2>&1',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    web:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: web
        image: sita-auth-observatory-web:${APP_IMAGE_TAG:-local}
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
        ports:
            - '127.0.0.1:${OBSERVATORY_PORT:-8012}:8080'
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:8080/up']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: application
        image: sita-auth-observatory-app:${APP_IMAGE_TAG:-local}
        restart: unless-stopped
        env_file:
            - .env.production
        volumes:
            - observatory_storage:/var/www/html/storage
        depends_on:
            app:
                condition: service_healthy
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'database',
                '--queue=experiment-dispatch',
                '--sleep=1',
                '--tries=1',
                '--timeout=60',
            ]

volumes:
    observatory_storage:
